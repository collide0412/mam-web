name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Firestore Rules
        run: npx -y firebase-tools@15.30.1 deploy --only firestore:rules --project mam-app-877da