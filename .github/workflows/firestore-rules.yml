name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify deployment credential is configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT repository secret. Add the complete service-account JSON in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prime Firebase API cache
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');

          const projectId = 'mam-app-877da';
          const apiName = 'firestore.googleapis.com';
          const filePath = path.join(os.homedir(), '.config', 'configstore', 'firebase-tools.json');

          fs.mkdirSync(path.dirname(filePath), { recursive: true });

          let content = {};
          if (fs.existsSync(filePath)) {
            content = JSON.parse(fs.readFileSync(filePath, 'utf8'));
          }

          content.apiEnablementCache ??= {};
          content.apiEnablementCache[projectId] ??= {};
          content.apiEnablementCache[projectId][apiName] = true;

          fs.writeFileSync(filePath, JSON.stringify(content));
          EOF

      - name: Deploy Firestore Rules
        run: npx -y firebase-tools@15.30.1 deploy --only firestore:rules --project mam-app-877da